<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Budget Tracker</h1> 
        <nav>   
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="Budget.html">Budget</a></li>
                <li><a href="financialHealth.html">Expenses</a></li>
                <li><a href="accountshtml">Income</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Budget </h2>
            <p>Welcome to the Budget Tracker! Here you can manage your budget and track your expenses. Use the form below to add your budget details.</p>
            <form id="budgetForm">
                <p>
                <label for="incomeType">Income Name:</label>
                <input type="text" id="incomeType" name="incomeType" required>
                <label for="incomeAmount">Amount:</label>
                <input type="number" id="incomeAmount" name="incomeAmount" required>
                <button type="button" id="additionalIncomeButtonFields">Add Income</button>
                <submit type="submit">Submit Incomes</submit>
                </p>
                <p>
                <label for="expenseType">Expense Name:</label>
                <input type="text" id="expenseType" name="expenseType" required>
                <label for="expenseAmount">Amount:</label>
                <input type="number" id="expenseAmount" name="expenseAmount" required>
                <button type="button" id="addExpenseButton">Add Expense</button>
                <submit type="submit">Submit Expenses</submit>
                </p>
                <div id="additionalExpenseFields"></div>
                  <p>
                <label for="savingsType">Savings Name:</label>
                <input type="text" id="savingsType" name="savingsType" required>
                <label for="savingsAmount">Amount:</label>
                <input type="number" id="savingsAmount" name="savingsAmount" required>
                <button type="button" id="addSavingsButton">Add Savings</button>
                <submit type="submit">Submit Savings</submit>
                </p>
                <div id="additionalSavingsFields"></div>
            </form>
        </section>
    </main>
<script src="budget.js"></script>
</body>
</html>
